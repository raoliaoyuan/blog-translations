<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="460" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1a1a1a">中美 LLM 六维度定性对比</text>
  <text x="30" y="64" font-size="13" fill="#888">0–10 分,为作者定性评估而非精确基准分,仅示意梯队关系</text>

  <!-- legend -->
  <rect x="540" y="28" width="16" height="16" rx="3" fill="#2b6cb0"/>
  <text x="562" y="41" font-size="13" fill="#444">美国</text>
  <rect x="620" y="28" width="16" height="16" rx="3" fill="#c53030"/>
  <text x="642" y="41" font-size="13" fill="#444">中国</text>

  <!-- grid -->
  <g stroke="#eee" stroke-width="1">
    <line x1="200" y1="90" x2="200" y2="430"/>
    <line x1="290" y1="90" x2="290" y2="430"/>
    <line x1="380" y1="90" x2="380" y2="430"/>
    <line x1="470" y1="90" x2="470" y2="430"/>
    <line x1="560" y1="90" x2="560" y2="430"/>
    <line x1="650" y1="90" x2="650" y2="430"/>
    <line x1="740" y1="90" x2="740" y2="430"/>
  </g>
  <g font-size="11" fill="#aaa" text-anchor="middle">
    <text x="200" y="448">0</text>
    <text x="380" y="448">4</text>
    <text x="560" y="448">8</text>
    <text x="740" y="448">10</text>
  </g>

  <!-- scale: x = 200 + score*54 -->
  <!-- Row 1: 最前沿推理  US 9.5  CN 8 -->
  <text x="190" y="112" font-size="13" fill="#333" text-anchor="end">最前沿推理</text>
  <rect x="200" y="100" width="513" height="13" rx="2" fill="#2b6cb0"/>
  <rect x="200" y="115" width="432" height="13" rx="2" fill="#c53030"/>

  <!-- Row 2: 代码 / Agent  US 9.5  CN 7.5 -->
  <text x="190" y="162" font-size="13" fill="#333" text-anchor="end">代码 / Agent</text>
  <rect x="200" y="150" width="513" height="13" rx="2" fill="#2b6cb0"/>
  <rect x="200" y="165" width="405" height="13" rx="2" fill="#c53030"/>

  <!-- Row 3: 中文 / 本地化  US 7  CN 9.5 -->
  <text x="190" y="212" font-size="13" fill="#333" text-anchor="end">中文 / 本地化</text>
  <rect x="200" y="200" width="378" height="13" rx="2" fill="#2b6cb0"/>
  <rect x="200" y="215" width="513" height="13" rx="2" fill="#c53030"/>

  <!-- Row 4: 性价比  US 7  CN 9.5 -->
  <text x="190" y="262" font-size="13" fill="#333" text-anchor="end">性价比</text>
  <rect x="200" y="250" width="378" height="13" rx="2" fill="#2b6cb0"/>
  <rect x="200" y="265" width="513" height="13" rx="2" fill="#c53030"/>

  <!-- Row 5: 开放权重生态  US 5  CN 9 -->
  <text x="190" y="312" font-size="13" fill="#333" text-anchor="end">开放权重生态</text>
  <rect x="200" y="300" width="270" height="13" rx="2" fill="#2b6cb0"/>
  <rect x="200" y="315" width="486" height="13" rx="2" fill="#c53030"/>

  <!-- Row 6: 算力纵深  US 9.5  CN 6 -->
  <text x="190" y="362" font-size="13" fill="#333" text-anchor="end">算力纵深</text>
  <rect x="200" y="350" width="513" height="13" rx="2" fill="#2b6cb0"/>
  <rect x="200" y="365" width="324" height="13" rx="2" fill="#c53030"/>

  <!-- highlight algorithm gap closing vs compute gap -->
  <text x="30" y="405" font-size="12" fill="#c53030">↑ 算力纵深是中国唯一被显著拉开、且不完全由自己掌控的维度</text>
</svg>

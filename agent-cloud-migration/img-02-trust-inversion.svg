<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="900" height="420" fill="#FAFAFA"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A2E">信任边界反转 (Trust Boundary Inversion)</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#666">为什么云沙盒突然比你的笔记本更"安全"</text>

  <!-- LEFT PANEL: 2023 旧范式 -->
  <g transform="translate(40,90)">
    <rect width="370" height="290" rx="10" fill="#FFF" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="185" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#666">2023 旧范式</text>
    <text x="185" y="46" text-anchor="middle" font-size="11" fill="#888">人在终端,AI 在远端</text>

    <!-- Local zone (Trusted - Green) -->
    <rect x="20" y="70" width="155" height="190" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
    <text x="97" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#1B5E20">本地机器</text>
    <text x="97" y="112" text-anchor="middle" font-size="22">🛡️</text>
    <text x="97" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#1B5E20">可信区</text>
    <text x="97" y="170" text-anchor="middle" font-size="10" fill="#33691E">你的代码</text>
    <text x="97" y="188" text-anchor="middle" font-size="10" fill="#33691E">你的凭证</text>
    <text x="97" y="206" text-anchor="middle" font-size="10" fill="#33691E">你的工具链</text>
    <text x="97" y="234" text-anchor="middle" font-size="9" fill="#558B2F" font-style="italic">"东西在我手里就安全"</text>

    <!-- Cloud zone (Untrusted - Yellow/Red) -->
    <rect x="195" y="70" width="155" height="190" rx="6" fill="#FFCDD2" stroke="#C62828" stroke-width="2"/>
    <text x="272" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#B71C1C">云端</text>
    <text x="272" y="112" text-anchor="middle" font-size="22">⚠️</text>
    <text x="272" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#B71C1C">不可信区</text>
    <text x="272" y="170" text-anchor="middle" font-size="10" fill="#C62828">别人的机器</text>
    <text x="272" y="188" text-anchor="middle" font-size="10" fill="#C62828">数据要传出去</text>
    <text x="272" y="206" text-anchor="middle" font-size="10" fill="#C62828">隐私/合规风险</text>
    <text x="272" y="234" text-anchor="middle" font-size="9" fill="#D32F2F" font-style="italic">"传到云上要慎重"</text>
  </g>

  <!-- ARROW IN MIDDLE -->
  <g transform="translate(430,210)">
    <path d="M0 0 L40 0 L35 -8 M40 0 L35 8" stroke="#C2185B" stroke-width="3" fill="none"/>
    <text x="20" y="-15" text-anchor="middle" font-size="13" font-weight="700" fill="#C2185B">反转</text>
    <text x="20" y="28" text-anchor="middle" font-size="9" fill="#880E4F">agent 自动写文件</text>
    <text x="20" y="42" text-anchor="middle" font-size="9" fill="#880E4F">改变了"危险"含义</text>
  </g>

  <!-- RIGHT PANEL: 2026 新范式 -->
  <g transform="translate(490,90)">
    <rect width="370" height="290" rx="10" fill="#FFF" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="185" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A2E">2026 新范式</text>
    <text x="185" y="46" text-anchor="middle" font-size="11" fill="#888">人在终端,agent 自动执行</text>

    <!-- Local zone (NOW Risky - Red) -->
    <rect x="20" y="70" width="155" height="190" rx="6" fill="#FFCDD2" stroke="#C62828" stroke-width="2"/>
    <text x="97" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#B71C1C">本地机器</text>
    <text x="97" y="112" text-anchor="middle" font-size="22">💥</text>
    <text x="97" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#B71C1C">高代价区</text>
    <text x="97" y="170" text-anchor="middle" font-size="10" fill="#C62828">agent 误删 = 真损失</text>
    <text x="97" y="188" text-anchor="middle" font-size="10" fill="#C62828">凭证全在身边</text>
    <text x="97" y="206" text-anchor="middle" font-size="10" fill="#C62828">没有撤销键</text>
    <text x="97" y="234" text-anchor="middle" font-size="9" fill="#D32F2F" font-style="italic">"在我目录里 rm -rf 真痛"</text>

    <!-- Cloud zone (NOW Safe sandbox - Green) -->
    <rect x="195" y="70" width="155" height="190" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
    <text x="272" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#1B5E20">云沙盒</text>
    <text x="272" y="112" text-anchor="middle" font-size="22">🧊</text>
    <text x="272" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#1B5E20">隔离区</text>
    <text x="272" y="170" text-anchor="middle" font-size="10" fill="#33691E">用完即弃</text>
    <text x="272" y="188" text-anchor="middle" font-size="10" fill="#33691E">范围作用域凭证</text>
    <text x="272" y="206" text-anchor="middle" font-size="10" fill="#33691E">出错可回滚</text>
    <text x="272" y="234" text-anchor="middle" font-size="9" fill="#558B2F" font-style="italic">"在云里 rm -rf 不痛"</text>
  </g>

  <text x="450" y="405" text-anchor="middle" font-size="11" fill="#888" font-style="italic">当 agent 自动执行 shell · git push · 改文件 — "可信" 和 "危险" 的定义就翻转了</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="960" height="540" fill="#FAFAFA"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A2E">架构变迁:从「桌面工具」到「远程同事」</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#666">同步、一对一、本地状态 → 异步、一对多、云端状态</text>

  <!-- LEFT: OLD ARCHITECTURE -->
  <g transform="translate(30,90)">
    <rect width="420" height="420" rx="10" fill="#FFF" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="210" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#666">旧架构 · Local-First (2023-2024)</text>

    <!-- User -->
    <ellipse cx="210" cy="80" rx="42" ry="22" fill="#BBDEFB" stroke="#1976D2" stroke-width="2"/>
    <text x="210" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#0D47A1">用户</text>

    <!-- IDE -->
    <rect x="140" y="135" width="140" height="40" rx="6" fill="#C5E1A5" stroke="#558B2F" stroke-width="1.5"/>
    <text x="210" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#33691E">IDE / Terminal</text>

    <!-- Local Agent -->
    <rect x="100" y="210" width="220" height="50" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
    <text x="210" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#1B5E20">Local Agent (本地进程)</text>
    <text x="210" y="250" text-anchor="middle" font-size="9" fill="#558B2F">同步阻塞 · 一对一陪跑</text>

    <!-- Branch: LLM API -->
    <rect x="30" y="295" width="160" height="40" rx="6" fill="#F8BBD0" stroke="#C2185B" stroke-width="1.5"/>
    <text x="110" y="320" text-anchor="middle" font-size="11" fill="#880E4F">LLM API (推理)</text>

    <!-- Branch: Local Tools -->
    <rect x="230" y="295" width="160" height="40" rx="6" fill="#FFE0B2" stroke="#FB8C00" stroke-width="1.5"/>
    <text x="310" y="315" text-anchor="middle" font-size="11" fill="#E65100">本地文件 + 工具</text>
    <text x="310" y="328" text-anchor="middle" font-size="9" fill="#BF360C">bash · file · MCP</text>

    <!-- Arrows -->
    <line x1="210" y1="102" x2="210" y2="133" stroke="#666" stroke-width="1.5" marker-end="url(#arr1)"/>
    <line x1="210" y1="175" x2="210" y2="208" stroke="#666" stroke-width="1.5" marker-end="url(#arr1)"/>
    <line x1="170" y1="260" x2="120" y2="293" stroke="#666" stroke-width="1.5" marker-end="url(#arr1)"/>
    <line x1="250" y1="260" x2="300" y2="293" stroke="#666" stroke-width="1.5" marker-end="url(#arr1)"/>

    <!-- Footer characteristic -->
    <rect x="30" y="365" width="360" height="40" rx="4" fill="#FFF9C4" stroke="#F9A825" stroke-width="1"/>
    <text x="210" y="385" text-anchor="middle" font-size="11" fill="#F57F17">特征:同步 · 一对一 · 本地状态 · 看着 AI 干活</text>
  </g>

  <!-- ARROW IN MIDDLE -->
  <g transform="translate(470,290)">
    <path d="M0 0 L20 0 L15 -8 M20 0 L15 8" stroke="#C2185B" stroke-width="3" fill="none"/>
    <text x="10" y="-15" text-anchor="middle" font-size="12" font-weight="700" fill="#C2185B">演化</text>
  </g>

  <!-- RIGHT: NEW ARCHITECTURE -->
  <g transform="translate(510,90)">
    <rect width="420" height="420" rx="10" fill="#FFF" stroke="#0277BD" stroke-width="1.5"/>
    <text x="210" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0277BD">新架构 · Cloud-Managed (2026+)</text>

    <!-- Users (multi-device) -->
    <g>
      <ellipse cx="80" cy="78" rx="32" ry="18" fill="#BBDEFB" stroke="#1976D2" stroke-width="1.5"/>
      <text x="80" y="82" text-anchor="middle" font-size="9" fill="#0D47A1">桌面</text>
      <ellipse cx="160" cy="78" rx="32" ry="18" fill="#BBDEFB" stroke="#1976D2" stroke-width="1.5"/>
      <text x="160" y="82" text-anchor="middle" font-size="9" fill="#0D47A1">手机</text>
      <ellipse cx="240" cy="78" rx="32" ry="18" fill="#BBDEFB" stroke="#1976D2" stroke-width="1.5"/>
      <text x="240" y="82" text-anchor="middle" font-size="9" fill="#0D47A1">Web</text>
      <ellipse cx="320" cy="78" rx="32" ry="18" fill="#BBDEFB" stroke="#1976D2" stroke-width="1.5"/>
      <text x="320" y="82" text-anchor="middle" font-size="9" fill="#0D47A1">IDE</text>
    </g>

    <!-- Control Plane -->
    <rect x="100" y="115" width="220" height="40" rx="6" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="2"/>
    <text x="210" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#4A148C">Control Plane (调度/路由)</text>

    <!-- Managed Runtime -->
    <rect x="50" y="180" width="320" height="60" rx="6" fill="#FFE0B2" stroke="#E65100" stroke-width="2.5"/>
    <text x="210" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#BF360C">Managed Agent Runtime</text>
    <text x="210" y="220" text-anchor="middle" font-size="10" fill="#BF360C">(云沙盒 · 多实例并行 · 状态持久化)</text>
    <text x="210" y="234" text-anchor="middle" font-size="9" fill="#E65100" font-style="italic">Anthropic / OpenAI / Cloudflare / AWS 等托管</text>

    <!-- Stateful Storage + LLM + Tools row -->
    <rect x="30" y="260" width="115" height="36" rx="6" fill="#F8BBD0" stroke="#C2185B" stroke-width="1.5"/>
    <text x="87" y="282" text-anchor="middle" font-size="10" fill="#880E4F">LLM 推理</text>

    <rect x="155" y="260" width="115" height="36" rx="6" fill="#C5CAE9" stroke="#283593" stroke-width="1.5"/>
    <text x="212" y="282" text-anchor="middle" font-size="10" fill="#1A237E">工具集合</text>

    <rect x="280" y="260" width="115" height="36" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="337" y="282" text-anchor="middle" font-size="10" fill="#1B5E20">状态持久化</text>

    <!-- Async Notification -->
    <rect x="80" y="320" width="260" height="36" rx="6" fill="#FFCDD2" stroke="#C62828" stroke-width="1.5"/>
    <text x="210" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#B71C1C">异步通知 → 任意设备的用户</text>

    <!-- Arrows -->
    <line x1="210" y1="96" x2="210" y2="113" stroke="#666" stroke-width="1.5" marker-end="url(#arr1)"/>
    <line x1="210" y1="155" x2="210" y2="178" stroke="#666" stroke-width="1.5" marker-end="url(#arr1)"/>

    <line x1="180" y1="240" x2="120" y2="258" stroke="#666" stroke-width="1.5" marker-end="url(#arr1)"/>
    <line x1="210" y1="240" x2="210" y2="258" stroke="#666" stroke-width="1.5" marker-end="url(#arr1)"/>
    <line x1="240" y1="240" x2="305" y2="258" stroke="#666" stroke-width="1.5" marker-end="url(#arr1)"/>

    <line x1="210" y1="296" x2="210" y2="318" stroke="#C2185B" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr2)"/>

    <!-- Footer characteristic -->
    <rect x="30" y="365" width="360" height="40" rx="4" fill="#E0F2F1" stroke="#00796B" stroke-width="1"/>
    <text x="210" y="385" text-anchor="middle" font-size="11" fill="#004D40">特征:异步 · 一对多 · 云端状态 · 收到 PR 再审</text>
  </g>

  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2185B"/>
    </marker>
  </defs>
</svg>

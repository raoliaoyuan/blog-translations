<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1f2937; }
    .sub-title { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .label { font-size: 12px; fill: #1f2937; }
    .sub { font-size: 11px; fill: #6b7280; }
    .big { font-size: 22px; font-weight: 800; }
  </style>
  <text x="20" y="30" class="title">从 token 比到美元 / 月：三层放大叠加</text>
  <text x="20" y="50" class="sub">162:1 只是出发点。下面三层叠加之后，才是企业出口账单实际承担的</text>

  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="180" height="320" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="90" y="32" text-anchor="middle" class="sub-title" fill="#92400e">① 编码层</text>
    <text x="90" y="55" text-anchor="middle" class="big" fill="#92400e">× 3–5</text>

    <text x="20" y="95" class="label" font-weight="600">JSON 结构</text>
    <text x="20" y="115" class="sub">字段名、引号、逗号</text>

    <text x="20" y="150" class="label" font-weight="600">UTF-8 编码</text>
    <text x="20" y="170" class="sub">中文 3 字节 / 字符</text>

    <text x="20" y="205" class="label" font-weight="600">HTTP/2 帧 + TLS</text>
    <text x="20" y="225" class="sub">头部、伪头、加密开销</text>

    <text x="20" y="260" class="label" font-weight="600">多模态 base64</text>
    <text x="20" y="280" class="sub">截图 1568 token → 200KB–2MB</text>

    <text x="90" y="307" text-anchor="middle" class="sub" fill="#92400e">token → 字节</text>
  </g>

  <g transform="translate(260, 175)" font-size="40">
    <text x="0" y="0" fill="#9ca3af">×</text>
  </g>

  <g transform="translate(305, 90)">
    <rect x="0" y="0" width="280" height="320" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="140" y="32" text-anchor="middle" class="sub-title" fill="#991b1b">② 上下行不对称</text>
    <text x="140" y="55" text-anchor="middle" class="big" fill="#991b1b">+ 工作时段集中</text>

    <text x="20" y="100" class="label" font-weight="600">家宽 / 企业出口套餐</text>
    <text x="20" y="120" class="sub">下行 1000 Mbps、上行 100 Mbps</text>
    <text x="20" y="138" class="sub" font-weight="600" fill="#dc2626">→ 100 Mbps 上行先撞墙</text>

    <text x="20" y="178" class="label" font-weight="600">SD-WAN / 专线合约</text>
    <text x="20" y="198" class="sub">按下行 N 买，上行作"附赠"</text>
    <text x="20" y="216" class="sub" font-weight="600" fill="#dc2626">→ AI Agent 时代不匹配</text>

    <text x="20" y="256" class="label" font-weight="600">95th percentile in/out 口径</text>
    <text x="20" y="276" class="sub">sum(in,out) 合约同时算两边</text>
    <text x="20" y="294" class="sub" font-weight="600" fill="#dc2626">→ 同一笔流量两次计费</text>
  </g>

  <g transform="translate(615, 175)" font-size="40">
    <text x="0" y="0" fill="#9ca3af">×</text>
  </g>

  <g transform="translate(660, 90)">
    <rect x="0" y="0" width="220" height="320" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="110" y="32" text-anchor="middle" class="sub-title" fill="#5b21b6">③ 跨境集中</text>
    <text x="110" y="55" text-anchor="middle" class="big" fill="#5b21b6">× 5–50</text>

    <text x="20" y="95" class="label" font-weight="600">模型 API 全在境外</text>
    <text x="20" y="115" class="sub">无 region 在中国大陆</text>

    <text x="20" y="150" class="label" font-weight="600">国际加速 vs 国内出向</text>
    <text x="20" y="170" class="sub">单价高 5–10 倍</text>

    <text x="20" y="205" class="label" font-weight="600">IPLC 跨境专线</text>
    <text x="20" y="225" class="sub">¥/Mbps·月 比国内贵几十倍</text>

    <text x="20" y="260" class="label" font-weight="600">国家级出口配额</text>
    <text x="20" y="280" class="sub">钱不一定能买到带宽</text>

    <text x="110" y="307" text-anchor="middle" class="sub" fill="#5b21b6">中国语境特有</text>
  </g>

  <text x="450" y="445" text-anchor="middle" class="sub" font-weight="600">实际账单冲击 = token 比 × 编码放大 × 上下行错配 × 跨境溢价</text>
</svg>

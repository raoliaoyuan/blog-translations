<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1f2937; }
    .sub-title { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .label { font-size: 12px; fill: #1f2937; }
    .row-label { font-size: 13px; font-weight: 600; fill: #1f2937; }
    .sub { font-size: 11px; fill: #6b7280; }
    .arrow-old { stroke: #9ca3af; stroke-width: 3; fill: none; }
    .arrow-new { stroke: #dc2626; stroke-width: 3; fill: none; }
    .arrow-new-strong { stroke: #dc2626; stroke-width: 4.5; fill: none; }
  </style>
  <text x="20" y="30" class="title">三套商业体系建立在同一个被打穿的假设上</text>
  <text x="20" y="50" class="sub">"内容方 → 用户方" 是过去 20 年的隐式前提；AI Agent 时代它被反转</text>

  <text x="200" y="90" text-anchor="middle" class="sub-title" fill="#6b7280">旧假设（过去 20 年）</text>
  <text x="700" y="90" text-anchor="middle" class="sub-title" fill="#dc2626">AI Agent 时代的事实</text>

  <line x1="20" y1="105" x2="940" y2="105" stroke="#e5e7eb"/>

  <g transform="translate(0, 130)">
    <text x="20" y="20" class="row-label">公有云零售</text>
    <text x="20" y="38" class="sub">AWS / GCP / Azure</text>
    <text x="20" y="54" class="sub">阿里 / 腾讯 / 华为</text>

    <g transform="translate(180, 12)">
      <circle cx="20" cy="20" r="22" fill="#dbeafe" stroke="#2563eb"/>
      <text x="20" y="25" text-anchor="middle" class="label">客户</text>
      <line x1="44" y1="20" x2="166" y2="20" class="arrow-old" marker-end="url(#arrG)"/>
      <text x="105" y="11" text-anchor="middle" class="sub">下行收费</text>
      <circle cx="190" cy="20" r="22" fill="#dbeafe" stroke="#2563eb"/>
      <text x="190" y="25" text-anchor="middle" class="label">用户</text>
    </g>

    <g transform="translate(570, 12)">
      <circle cx="20" cy="20" r="22" fill="#fee2e2" stroke="#dc2626"/>
      <text x="20" y="25" text-anchor="middle" class="label">客户</text>
      <line x1="166" y1="20" x2="44" y2="20" class="arrow-new-strong" marker-end="url(#arrR3)"/>
      <text x="105" y="11" text-anchor="middle" class="sub" fill="#dc2626" font-weight="600">上行主导</text>
      <text x="105" y="40" text-anchor="middle" class="sub">推理 API 调用</text>
      <circle cx="190" cy="20" r="22" fill="#fee2e2" stroke="#dc2626"/>
      <text x="190" y="25" text-anchor="middle" class="label">推理</text>
    </g>
  </g>

  <line x1="20" y1="240" x2="940" y2="240" stroke="#e5e7eb"/>

  <g transform="translate(0, 265)">
    <text x="20" y="20" class="row-label">国际 BGP 对等</text>
    <text x="20" y="38" class="sub">settlement-free peering</text>

    <g transform="translate(180, 12)">
      <circle cx="20" cy="20" r="22" fill="#dbeafe" stroke="#2563eb"/>
      <text x="20" y="25" text-anchor="middle" class="label">AS-A</text>
      <line x1="44" y1="14" x2="166" y2="14" class="arrow-old" marker-end="url(#arrG)"/>
      <line x1="166" y1="28" x2="44" y2="28" class="arrow-old" marker-end="url(#arrG)"/>
      <text x="105" y="5" text-anchor="middle" class="sub">ratio ≈ 1:1</text>
      <circle cx="190" cy="20" r="22" fill="#dbeafe" stroke="#2563eb"/>
      <text x="190" y="25" text-anchor="middle" class="label">AS-B</text>
    </g>

    <g transform="translate(570, 12)">
      <circle cx="20" cy="20" r="22" fill="#fee2e2" stroke="#dc2626"/>
      <text x="20" y="25" text-anchor="middle" class="label">用户 ISP</text>
      <line x1="44" y1="14" x2="166" y2="14" class="arrow-new-strong" marker-end="url(#arrR3)"/>
      <line x1="166" y1="28" x2="44" y2="28" class="arrow-old" stroke-width="1.5" marker-end="url(#arrG)"/>
      <text x="105" y="5" text-anchor="middle" class="sub" fill="#dc2626" font-weight="600">ratio 倾斜</text>
      <text x="105" y="42" text-anchor="middle" class="sub">上行 ≫ 下行</text>
      <circle cx="190" cy="20" r="22" fill="#fee2e2" stroke="#dc2626"/>
      <text x="190" y="25" text-anchor="middle" class="label">推理 AS</text>
    </g>
  </g>

  <line x1="20" y1="360" x2="940" y2="360" stroke="#e5e7eb"/>

  <g transform="translate(0, 385)">
    <text x="20" y="20" class="row-label">中国行政互联</text>
    <text x="20" y="38" class="sub">三大运营商</text>
    <text x="20" y="54" class="sub">+ 工信部指导</text>

    <g transform="translate(160, 12)">
      <circle cx="30" cy="20" r="24" fill="#dbeafe" stroke="#2563eb"/>
      <text x="30" y="25" text-anchor="middle" class="label">境内 CDN</text>
      <line x1="56" y1="20" x2="166" y2="20" class="arrow-old" marker-end="url(#arrG)"/>
      <text x="111" y="11" text-anchor="middle" class="sub">境内可达</text>
      <circle cx="194" cy="20" r="24" fill="#dbeafe" stroke="#2563eb"/>
      <text x="194" y="25" text-anchor="middle" class="label">境内用户</text>
    </g>

    <g transform="translate(548, 12)">
      <circle cx="30" cy="20" r="24" fill="#fee2e2" stroke="#dc2626"/>
      <text x="30" y="25" text-anchor="middle" class="label">境内用户</text>
      <line x1="56" y1="20" x2="166" y2="20" class="arrow-new-strong" marker-end="url(#arrR3)"/>
      <text x="111" y="11" text-anchor="middle" class="sub" fill="#dc2626" font-weight="600">跨境出口</text>
      <text x="111" y="42" text-anchor="middle" class="sub">配额管制 + 高溢价</text>
      <circle cx="194" cy="20" r="24" fill="#fee2e2" stroke="#dc2626"/>
      <text x="194" y="25" text-anchor="middle" class="label">境外推理</text>
    </g>
  </g>

  <rect x="20" y="470" width="920" height="55" rx="6" fill="#fef3c7" stroke="#facc15" stroke-width="1.5"/>
  <text x="480" y="493" text-anchor="middle" class="label" fill="#92400e" font-weight="600">三套体系的合同、价目表、容量规划都建立在"客户消费下行"假设上</text>
  <text x="480" y="513" text-anchor="middle" class="sub" fill="#92400e">当 AI Agent 让方向反转，这三套体系开始同时承压</text>

  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L9,5 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrR3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L9,5 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1f2937; }
    .sub-title { font-size: 14px; font-weight: 600; fill: #1f2937; }
    .label { font-size: 12px; fill: #1f2937; }
    .sub { font-size: 11px; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
    .pkt-small { fill: #16a34a; }
    .pkt-large { fill: #dc2626; }
  </style>
  <text x="20" y="30" class="title">协议层降本的两种路线</text>
  <text x="20" y="50" class="sub">同样是"减少传输的浪费"，OpenAI 削字节、Anthropic 只削计费</text>

  <g transform="translate(20, 90)">
    <rect x="0" y="0" width="420" height="330" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" opacity="0.4"/>
    <text x="210" y="25" text-anchor="middle" class="sub-title" fill="#1e40af">OpenAI Responses API（stateful）</text>
    <text x="210" y="45" text-anchor="middle" class="sub">previous_response_id：服务端持有会话状态</text>

    <text x="20" y="80" class="sub" font-weight="600">第 1 轮：</text>
    <rect x="20" y="90" width="200" height="30" rx="2" class="pkt-large" opacity="0.85"/>
    <text x="120" y="110" text-anchor="middle" fill="#fff" class="label">完整 prompt（写入服务端 state）</text>
    <text x="230" y="110" class="sub">→ 返回 response_id</text>

    <text x="20" y="160" class="sub" font-weight="600">第 2 轮：</text>
    <rect x="20" y="170" width="60" height="30" rx="2" class="pkt-small"/>
    <text x="50" y="190" text-anchor="middle" fill="#fff" class="label">新 turn</text>
    <rect x="85" y="170" width="80" height="30" rx="2" fill="#16a34a" opacity="0.6"/>
    <text x="125" y="190" text-anchor="middle" fill="#fff" class="label">+ prev_id</text>
    <text x="180" y="190" class="sub">→ 服务端用 state 续</text>

    <text x="20" y="240" class="sub" font-weight="600">第 3 轮：</text>
    <rect x="20" y="250" width="60" height="30" rx="2" class="pkt-small"/>
    <text x="50" y="270" text-anchor="middle" fill="#fff" class="label">新 turn</text>
    <rect x="85" y="250" width="80" height="30" rx="2" fill="#16a34a" opacity="0.6"/>
    <text x="125" y="270" text-anchor="middle" fill="#fff" class="label">+ prev_id</text>
    <text x="180" y="270" class="sub">→ 同上</text>

    <rect x="20" y="295" width="380" height="25" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="210" y="313" text-anchor="middle" class="label" fill="#1e3a8a" font-weight="600">字节随轮数线性增长（slope 取决于新 turn 长度）</text>
  </g>

  <g transform="translate(460, 90)">
    <rect x="0" y="0" width="420" height="330" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" opacity="0.4"/>
    <text x="210" y="25" text-anchor="middle" class="sub-title" fill="#991b1b">Anthropic Messages API（stateless）</text>
    <text x="210" y="45" text-anchor="middle" class="sub">prompt caching：服务端只缓存 prefill，不缓存会话</text>

    <text x="20" y="80" class="sub" font-weight="600">第 1 轮：</text>
    <rect x="20" y="90" width="200" height="30" rx="2" class="pkt-large" opacity="0.85"/>
    <text x="120" y="110" text-anchor="middle" fill="#fff" class="label">完整 prompt（cache_creation）</text>

    <text x="20" y="160" class="sub" font-weight="600">第 2 轮：</text>
    <rect x="20" y="170" width="200" height="30" rx="2" class="pkt-large" opacity="0.85"/>
    <text x="120" y="190" text-anchor="middle" fill="#fff" class="label">完整 prompt + 新 turn</text>
    <text x="230" y="190" class="sub" fill="#dc2626" font-weight="600">cache_read</text>

    <text x="20" y="240" class="sub" font-weight="600">第 3 轮：</text>
    <rect x="20" y="250" width="240" height="30" rx="2" class="pkt-large" opacity="0.85"/>
    <text x="140" y="270" text-anchor="middle" fill="#fff" class="label">完整 prompt + 第 2 轮 + 新 turn</text>
    <text x="270" y="270" class="sub" fill="#dc2626" font-weight="600">cache_read</text>

    <rect x="20" y="295" width="380" height="25" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="210" y="313" text-anchor="middle" class="label" fill="#7f1d1d" font-weight="600">字节随轮数累积膨胀（每轮带全部历史）</text>
  </g>
</svg>

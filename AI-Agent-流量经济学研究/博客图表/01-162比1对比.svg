<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1f2937; }
    .label { font-size: 12px; fill: #1f2937; }
    .sub { font-size: 11px; fill: #6b7280; }
    .num { font-size: 13px; font-weight: 700; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
  </style>
  <text x="20" y="30" class="title">上行 / 下行比例：传统业务 vs AI Agent</text>
  <text x="20" y="50" class="sub">log 刻度 · 数值越大代表上行越压倒下行</text>

  <line x1="240" y1="100" x2="880" y2="100" class="axis"/>
  <line x1="240" y1="100" x2="240" y2="420" class="axis"/>
  <line x1="240" y1="420" x2="880" y2="420" class="axis"/>

  <line x1="240" y1="100" x2="240" y2="420" class="axis" stroke-dasharray="2,3"/>
  <text x="240" y="440" class="sub" text-anchor="middle">1:1</text>

  <line x1="346" y1="100" x2="346" y2="420" class="axis" stroke-dasharray="2,3"/>
  <text x="346" y="440" class="sub" text-anchor="middle">10×</text>

  <line x1="452" y1="100" x2="452" y2="420" class="axis" stroke-dasharray="2,3"/>
  <text x="452" y="440" class="sub" text-anchor="middle">100×</text>

  <line x1="558" y1="100" x2="558" y2="420" class="axis" stroke-dasharray="2,3"/>
  <text x="558" y="440" class="sub" text-anchor="middle">1,000×</text>

  <line x1="664" y1="100" x2="664" y2="420" class="axis" stroke-dasharray="2,3"/>
  <text x="664" y="440" class="sub" text-anchor="middle">10,000×</text>

  <line x1="770" y1="100" x2="770" y2="420" class="axis" stroke-dasharray="2,3"/>
  <text x="770" y="440" class="sub" text-anchor="middle">100,000×</text>

  <text x="20" y="95" class="sub">← 下行多</text>
  <text x="880" y="95" class="sub" text-anchor="end">上行多 →</text>

  <g transform="translate(0,110)">
    <rect x="180" y="0" width="60" height="22" fill="#16a34a" opacity="0.7"/>
    <text x="170" y="16" class="label" text-anchor="end">视频流</text>
    <text x="245" y="16" class="num" fill="#16a34a">下行 100× 上行</text>
  </g>

  <g transform="translate(0,145)">
    <rect x="120" y="0" width="120" height="22" fill="#16a34a" opacity="0.5"/>
    <text x="170" y="16" class="label" text-anchor="end">Web 浏览</text>
    <text x="245" y="16" class="num" fill="#16a34a">下行 10× 上行</text>
  </g>

  <g transform="translate(0,180)">
    <rect x="235" y="0" width="10" height="22" fill="#6b7280"/>
    <text x="170" y="16" class="label" text-anchor="end">视频会议</text>
    <text x="250" y="16" class="num" fill="#6b7280">~ 对称</text>
  </g>

  <g transform="translate(0,215)">
    <rect x="240" y="0" width="106" height="22" fill="#facc15" opacity="0.85"/>
    <text x="170" y="16" class="label" text-anchor="end">SaaS API</text>
    <text x="356" y="16" class="num" fill="#a16207">上行 10×</text>
  </g>

  <g transform="translate(0,250)">
    <rect x="240" y="0" width="155" height="22" fill="#facc15" opacity="0.95"/>
    <text x="170" y="16" class="label" text-anchor="end">业界 chatbot 估算</text>
    <text x="405" y="16" class="num" fill="#a16207">上行 10–30×</text>
  </g>

  <g transform="translate(0,285)">
    <rect x="240" y="0" width="235" height="22" fill="#dc2626" opacity="0.9"/>
    <text x="170" y="16" class="label" text-anchor="end">本研究实测 · 加权</text>
    <text x="485" y="16" class="num" fill="#dc2626">上行 162× 下行</text>
  </g>

  <g transform="translate(0,320)">
    <rect x="240" y="0" width="270" height="22" fill="#dc2626"/>
    <text x="170" y="16" class="label" text-anchor="end">单次调用中位数</text>
    <text x="520" y="16" class="num" fill="#dc2626">上行 386×</text>
  </g>

  <g transform="translate(0,355)">
    <rect x="240" y="0" width="402" height="22" fill="#7f1d1d"/>
    <text x="170" y="16" class="label" text-anchor="end">单次调用 · p90</text>
    <text x="652" y="16" class="num" fill="#7f1d1d">上行 24,470×</text>
  </g>

  <g transform="translate(0,390)">
    <rect x="240" y="0" width="453" height="22" fill="#450a0a"/>
    <text x="170" y="16" class="label" text-anchor="end">单次调用 · p99</text>
    <text x="703" y="16" class="num" fill="#450a0a">上行 71,149×</text>
  </g>
</svg>
